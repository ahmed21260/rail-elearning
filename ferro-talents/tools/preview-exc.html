<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<script type="module">
// Aperçu de la pelle réaliste dans 3 poses (transport, travail, déversement) + points de contrôle
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { buildExcavator, EXC } from "../src/vehicles/excavator.js";
const t0=performance.now(); const log=(m)=>console.log(`${((performance.now()-t0)/1000).toFixed(1)}s ${m}`);
const W=1500,H=560; const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); document.body.appendChild(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace; r.setScissorTest(true); r.shadowMap.enabled=false;
const gl=await new GLTFLoader().loadAsync("../assets/models/sf/pelle_atek.glb");
const poses=[EXC.transport,{swing:0.5,boom:0.1,stick:-1.3,bucket:-0.4},{swing:-1.2,boom:0.7,stick:-0.9,bucket:1.1}];
const info=[];
for(let i=0;i<3;i++){
  const s=new THREE.Scene(); s.background=new THREE.Color(0xdde3ea); s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment()).texture; s.environmentIntensity=0.6;
  const d=new THREE.DirectionalLight(0xfff4e0,2.5); d.position.set(6,10,5); d.castShadow=true; d.shadow.camera.left=d.shadow.camera.bottom=-10; d.shadow.camera.right=d.shadow.camera.top=10; s.add(d);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x8a8f86})); g.rotation.x=-Math.PI/2; g.receiveShadow=true; s.add(g);
  const ex=buildExcavator(s, i===0?gl:{...gl, scene: (await new GLTFLoader().loadAsync("../assets/models/sf/pelle_atek.glb")).scene});
  Object.assign(ex.joints,poses[i]); ex.pose(ex.joints); ex.update();
  for(const p of ex.probes()){const m=new THREE.Mesh(new THREE.SphereGeometry(0.07),new THREE.MeshBasicMaterial({color:0xff0000})); m.position.copy(p); s.add(m);}
  const t=new THREE.Mesh(new THREE.SphereGeometry(0.1),new THREE.MeshBasicMaterial({color:0x00aaff})); t.position.copy(ex.tip()); s.add(t);
  const top=Math.max(...ex.probes().map(p=>p.y));
  info.push({top:+top.toFixed(2), tip:ex.tip().toArray().map(v=>+v.toFixed(2)), seat:ex.seat().toArray().map(v=>+v.toFixed(2))});
  const cam=new THREE.PerspectiveCamera(32,(W/3)/H,0.1,200); cam.position.set(9,4.2,7); cam.lookAt(0,2,-2);
  log('pose '+i+' prête'); r.setViewport(i*W/3,0,W/3,H); r.setScissor(i*W/3,0,W/3,H); r.render(s,cam); log('pose '+i+' rendue');
}
window.info={EXC:{boomLen:EXC.boomLen,stickLen:EXC.stickLen,pivot:EXC.pivot}, poses:info}; window.done=true;
</script></body></html>
